<div class="pv-shell">
  @if (loading()) {
    <div class="pv-loading">
      <div class="pv-spinner"></div>
    </div>
  } @else if (notFound()) {
    <div class="pv-not-found">
      <span class="material-icons pv-nf-icon">article</span>
      <h1>Page Not Found</h1>
      <p>This page doesn't exist or hasn't been published yet.</p>
      <a routerLink="/" class="pv-home-btn">Go Home</a>
    </div>
  } @else if (page()) {
    <article class="pv-article">
      <header class="pv-hero">
        <div class="pv-hero-inner">
          <h1 class="pv-title">{{ page()!.title }}</h1>
          @if (page()!.metaDescription) {
            <p class="pv-subtitle">{{ page()!.metaDescription }}</p>
          }
        </div>
      </header>

      <div class="pv-body">
        <div class="pv-content" [innerHTML]="safeContent"></div>
      </div>
    </article>
  }
</div>
