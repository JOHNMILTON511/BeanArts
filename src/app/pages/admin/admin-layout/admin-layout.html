<div class="admin-shell">

  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.open]="sidebarOpen()">

    <!-- Decorative orbs -->
    <div class="admin-orb admin-orb-1"></div>
    <div class="admin-orb admin-orb-2"></div>

    <!-- Brand -->
    <div class="admin-sidebar-header">
      <div class="admin-logo">
        <div class="admin-logo-icon">
          <img src="assets/logo/3.png" alt="BeanArts" />
        </div>
        <div class="admin-logo-text">
          <span class="admin-brand">BeanArts</span>
          <span class="admin-panel-tag">Admin Panel</span>
        </div>
      </div>
      <button class="admin-close-btn" (click)="sidebarOpen.set(false)" aria-label="Close menu" matTooltip="Close menu">
        <span class="material-icons">close</span>
      </button>
    </div>

    <!-- Navigation -->
    <div class="admin-nav-label">Management</div>
    <nav class="admin-nav">
      @for (item of navItems; track item.route) {
        <a
          class="admin-nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="sidebarOpen.set(false)"
        >
          <div class="admin-nav-icon"><span class="material-icons">{{ item.icon }}</span></div>
          <span class="admin-nav-text">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer -->
    <div class="admin-sidebar-footer">
      <div class="admin-nav-label">Account</div>
      <a routerLink="/dashboard" class="admin-nav-item" (click)="sidebarOpen.set(false)">
        <div class="admin-nav-icon admin-nav-icon--blue"><span class="material-icons">person</span></div>
        <span class="admin-nav-text">My Account</span>
      </a>
      <button class="admin-nav-item admin-logout" (click)="logout()">
        <div class="admin-nav-icon admin-nav-icon--red"><span class="material-icons">logout</span></div>
        <span class="admin-nav-text">Sign Out</span>
      </button>
    </div>

  </aside>

  @if (sidebarOpen()) {
    <div class="admin-overlay" (click)="sidebarOpen.set(false)"></div>
  }

  <div class="admin-main">

    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-menu-btn" (click)="sidebarOpen.set(true)" aria-label="Open menu" matTooltip="Open menu">
          <span class="material-icons">menu</span>
        </button>
        <a routerLink="/" class="admin-topbar-logo">
          <img src="assets/logo/3.png" alt="BeanArts" class="admin-topbar-logo-img" />
          <div class="admin-topbar-logo-text">
            <span class="admin-topbar-logo-name">BeanArts</span>
            <span class="admin-topbar-logo-tag">Admin</span>
          </div>
        </a>
      </div>

      <div class="admin-topbar-right">
        <div class="admin-topbar-badge">
          <span class="material-icons">verified_user</span>
          <span>Administrator</span>
        </div>
        <a routerLink="/dashboard" class="admin-icon-btn" matTooltip="My Account">
          <span class="material-icons">person_outline</span>
        </a>
        <button class="admin-icon-btn admin-icon-btn--red" (click)="logout()" matTooltip="Sign Out">
          <span class="material-icons">logout</span>
        </button>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
