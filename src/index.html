    #ba-init-loader {

    .ba-init-ring {

      width: 52px;
      height: 52px;
    }
    .ba-init-ring-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3.5px solid #eef2ff;
      border-top-color: #4f46e5;
      animation: ba-spin 0.75s linear infinite;

    .ba-init-tagline {

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9ca3af;
      margin: 0;
    }
    @keyframes ba-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <app-root>
    <!--
      This loader is visible ONLY while Angular hasn't bootstrapped yet
      (e.g. slow network / CSR fallback). Angular replaces this entire
      <app-root> content on bootstrap, so no extra cleanup is needed.
      In SSR mode the server fills <app-root> with real HTML, so users
      with a good connection never see this spinner at all.
    -->
    <div id="ba-init-loader" aria-hidden="true">
      <div class="ba-init-logo">
        <span class="ba-init-logo-bean">Bean</span><span class="ba-init-logo-arts">Arts</span>
